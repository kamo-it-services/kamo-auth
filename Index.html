<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="referrer" content="no-referrer">
  <meta name="robots" content="noindex">
  <title>Kamo IT Account Portal</title>
  <meta name="theme-color" content="#12366b">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Kamo IT">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <style>
    :root { --navy: #12366b; --yellow: #ffd54a; --ink: #172033; --bg: #f4f7fb; }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; background: var(--bg); font: 15px/1.5 Roboto, Arial, sans-serif; color: var(--ink); }
    body { padding-top: env(safe-area-inset-top); }
    #app { position: fixed; inset: env(safe-area-inset-top) 0 0 0; width: 100%; height: calc(100% - env(safe-area-inset-top)); border: 0; display: block; background: var(--bg); }

    /* Màn hình chờ khi đang tải cổng */
    #splash { position: fixed; inset: 0; z-index: 10; display: grid; place-items: center; background: var(--navy); color: #dbe7f8; transition: opacity .25s; }
    #splash.done { opacity: 0; pointer-events: none; }
    .splash-inner { display: grid; justify-items: center; gap: 18px; padding: 24px; text-align: center; }
    .splash-inner img { width: 96px; height: 96px; border-radius: 22px; }
    .bar { width: 120px; height: 3px; border-radius: 3px; background: rgba(255,255,255,.15); overflow: hidden; }
    .bar::after { content: ""; display: block; width: 40%; height: 100%; background: var(--yellow); animation: slide 1.1s ease-in-out infinite; }
    @keyframes slide { 0% { transform: translateX(-100%); } 100% { transform: translateX(260%); } }
    #splashMsg { margin: 0; font-size: 14px; max-width: 280px; }
    #retryBtn { display: none; font: inherit; font-weight: 700; padding: 9px 18px; border: 0; border-radius: 999px; background: var(--yellow); color: var(--navy); cursor: pointer; }

    /* Gợi ý cài đặt ứng dụng */
    #install { position: fixed; z-index: 20; left: 12px; right: 12px; bottom: calc(12px + env(safe-area-inset-bottom)); max-width: 460px; margin: 0 auto; display: none; align-items: center; gap: 12px; padding: 12px 14px; background: #fff; border: 1px solid #e5eaf2; border-radius: 14px; box-shadow: 0 10px 30px rgba(18,54,107,.18); }
    #install.show { display: flex; }
    #install img { width: 40px; height: 40px; border-radius: 10px; flex: none; }
    #install p { margin: 0; flex: 1; font-size: 13.5px; line-height: 1.4; }
    #install b { display: block; font-size: 14.5px; color: var(--navy); }
    #installBtn { flex: none; font: inherit; font-weight: 700; font-size: 14px; padding: 8px 14px; border: 0; border-radius: 999px; background: var(--navy); color: #fff; cursor: pointer; }
    #installClose { flex: none; width: 30px; height: 30px; padding: 0; border: 0; border-radius: 8px; background: transparent; color: #667085; font-size: 20px; line-height: 1; cursor: pointer; }
    #installBtn:focus-visible, #installClose:focus-visible, #retryBtn:focus-visible { outline: 3px solid rgba(255,213,74,.6); outline-offset: 2px; }
    @media (prefers-reduced-motion: reduce) { .bar::after { animation: none; width: 100%; } #splash { transition: none; } }
  </style>
</head>
<body>
  <div id="splash" role="status" aria-live="polite">
    <div class="splash-inner">
      <img src="icon-192.png" alt="Kamo">
      <div class="bar" aria-hidden="true"></div>
      <p id="splashMsg">Đang mở cổng tài khoản…</p>
      <button type="button" id="retryBtn">Thử lại</button>
    </div>
  </div>

  <iframe id="app" title="Kamo IT Account Portal" allow="clipboard-write; clipboard-read" referrerpolicy="no-referrer"></iframe>

  <div id="install" role="dialog" aria-label="Cài đặt ứng dụng">
    <img src="icon-192.png" alt="">
    <p id="installText"><b>Cài Kamo IT Account Portal lên máy</b>Mở nhanh từ màn hình chính, không cần tìm link.</p>
    <button type="button" id="installBtn">Cài đặt</button>
    <button type="button" id="installClose" aria-label="Đóng">×</button>
  </div>

  <script>
    (function () {
      var APP_URL = 'https://script.google.com/macros/s/AKfycbxny4mNYQwfv3idsPaPdZG3iDv_DH5qa3qSi4u4K1waAMjJkInEZb-xf6qfs9RCK8jCMw/exec';

      var frame = document.getElementById('app');
      var splash = document.getElementById('splash');
      var splashMsg = document.getElementById('splashMsg');
      var retryBtn = document.getElementById('retryBtn');

      /* ===== Nạp cổng vào khung ===== */
      // Sau khi đăng nhập Google, callback.html chuyển về đây kèm code/state -> chuyển tiếp vào khung
      var src = new URLSearchParams(location.search);
      var pass = new URLSearchParams();
      ['code', 'state', 'error'].forEach(function (k) { if (src.has(k)) pass.set(k, src.get(k)); });
      var target = APP_URL + (pass.toString() ? '?' + pass.toString() : '');
      if (location.search) history.replaceState(null, '', location.pathname); // xoá code khỏi thanh địa chỉ

      var loadTimer;
      function load(url) {
        splash.classList.remove('done');
        splashMsg.textContent = navigator.onLine === false ? 'Không có kết nối mạng.' : 'Đang mở cổng tài khoản…';
        retryBtn.style.display = 'none';
        clearTimeout(loadTimer);
        loadTimer = setTimeout(function () {
          splashMsg.textContent = 'Kết nối chậm hơn bình thường. Kiểm tra mạng rồi bấm Thử lại.';
          retryBtn.style.display = 'inline-block';
        }, 20000);
        frame.src = url;
      }
      frame.addEventListener('load', function () {
        clearTimeout(loadTimer);
        splash.classList.add('done');
      });
      retryBtn.addEventListener('click', function () { load(APP_URL); });
      window.addEventListener('online', function () { if (!splash.classList.contains('done')) load(APP_URL); });
      load(target);

      /* ===== Service worker (để trình duyệt cho phép cài đặt) ===== */
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', function () { navigator.serviceWorker.register('sw.js').catch(function () {}); });
      }

      /* ===== Gợi ý cài đặt ===== */
      var box = document.getElementById('install');
      var installBtn = document.getElementById('installBtn');
      var installText = document.getElementById('installText');
      var standalone = window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone === true;
      var dismissed = false;
      try { dismissed = localStorage.getItem('kamo_install_dismissed') === '1'; } catch (e) {}
      var deferred = null;

      function showBox() { if (!standalone && !dismissed) box.classList.add('show'); }
      document.getElementById('installClose').addEventListener('click', function () {
        box.classList.remove('show');
        try { localStorage.setItem('kamo_install_dismissed', '1'); } catch (e) {}
      });

      // Android / Chrome / Edge trên máy tính
      window.addEventListener('beforeinstallprompt', function (e) {
        e.preventDefault();
        deferred = e;
        setTimeout(showBox, 1500);
      });
      installBtn.addEventListener('click', function () {
        if (!deferred) return;
        deferred.prompt();
        deferred.userChoice.finally(function () { deferred = null; box.classList.remove('show'); });
      });
      window.addEventListener('appinstalled', function () { box.classList.remove('show'); });

      // iPhone / iPad: Safari không có nút cài tự động -> hướng dẫn bằng chữ
      var isIOS = /iphone|ipad|ipod/i.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
      if (isIOS && !standalone) {
        installText.innerHTML = '<b>Cài Kamo IT Account Portal lên máy</b>Bấm nút Chia sẻ của Safari, rồi chọn “Thêm vào MH chính”.';
        installBtn.style.display = 'none';
        setTimeout(showBox, 2500);
      }
    })();
  </script>
</body>
</html>
